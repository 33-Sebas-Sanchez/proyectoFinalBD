spring:
  application:
    name: compras-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compras_abastecimiento}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 30000
      maximum-pool-size: 5
  sql:
    init:
      mode: never

server:
  port: ${PORT:8082}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    db:
      enabled: false

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
